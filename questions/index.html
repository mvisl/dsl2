<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вопрос разработчика · Design System</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="./styles.css"></head>
<body><main class="question-page">
<nav aria-label="Разделы"><a href="../">← Design System</a><a href="../developer/">Конструктор ↗</a></nav>
<header><p class="eyebrow">DESIGN SYSTEM · FACELIFTING 2</p><h1>Задать вопрос</h1><p class="intro">По экрану, компоненту или общему принципу. Вход не нужен.</p></header>
<form><label for="title">Тема</label><input id="title" name="title" required maxlength="160" autocomplete="off" placeholder="Например, отступы в карточке инструмента">
<label for="body">Вопрос</label><textarea id="body" name="body" required maxlength="6000" placeholder="Что нужно уточнить?"></textarea>
<label for="context">Экран или ссылка <span>· необязательно</span></label><input id="context" name="context" maxlength="2000" autocomplete="off" placeholder="Название экрана или ссылка на него">
<button type="submit">Отправить вопрос <span aria-hidden="true">↗</span></button><p class="hint">Вопрос попадёт в очередь разбора.</p></form>
<p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="app.js"></script></body></html>

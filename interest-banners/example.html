<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local Interest banner example</title><style>body{background:#eee;font:14px system-ui;margin:24px}.container{width:100%;max-width:744px}label{display:block;margin:18px 0}input{width:260px}</style><h1>Local Interest banner</h1><label>Position <input type="range" min="5" max="95" step=".1" value="56.125356" id="position"></label><div class="container"><interest-banner id="banner"></interest-banner></div><p id="status">Click the banner to connect your navigation.</p><script type="module">import './interest-banner.js';const b=document.querySelector('#banner');b.config={template:'earning',position:56.125356};document.querySelector('#position').oninput=e=>b.config={template:'earning',position:Number(e.target.value)};b.onclick=()=>document.querySelector('#status').textContent='Your app opens the Interest screen here.';</script></html>
